    <!-- White Paper Sheet -->
    <path d="M144 88 H312 L384 160 V416 C384 429.25 373.25 440 360 440 H144 C130.75 440 120 429.25 120 416 V112 C120 98.75 130.75 88 144 88 Z" fill="#ffffff"/>
    <!-- Folded Corner -->
    <path d="M312 88 V152 C312 156.4 315.6 160 320 160 H384 Z" fill="#e2e8f0"/>
  </g>

  <!-- Document Lines -->
  <rect x="160" y="196" width="130" height="18" rx="9" fill="#08a0d8" opacity="0.85"/>
  <rect x="160" y="234" width="180" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="160" y="264" width="150" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="160" y="294" width="170" height="14" rx="7" fill="#cbd5e1"/>

  <!-- Official Seal / Stamp Emblem (Bottom-Left) -->
  <circle cx="204" cy="368" r="32" fill="#05ad72" stroke="#ffffff" stroke-width="4"/>
  <!-- Stamp icon (Temple/Columns) -->
  <path d="M188 376 H220 M192 376 V362 M200 376 V362 M208 376 V362 M216 376 V362 M186 362 H222 M204 352 L184 362 H224 Z" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Signature Ribbon (Bottom-Right) -->
